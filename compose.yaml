services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --lower-case-table-names=1
    environment:
      MYSQL_DATABASE: uni
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/scheme_creation.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/generate_persons.sql:/docker-entrypoint-initdb.d/02-persons.sql:ro
      - ./db/generate_students.sql:/docker-entrypoint-initdb.d/03-students.sql:ro
      - ./db/generate_teachers.sql:/docker-entrypoint-initdb.d/04-teachers.sql:ro
      - ./db/generate_classes.sql:/docker-entrypoint-initdb.d/05-classes.sql:ro
      - ./db/generate_rooms.sql:/docker-entrypoint-initdb.d/06-rooms.sql:ro
      - ./db/generate_classes_students.sql:/docker-entrypoint-initdb.d/07-class-students.sql:ro
      - ./db/generate_schedules.sql:/docker-entrypoint-initdb.d/08-schedules.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  python:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-uni}
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app}
    volumes:
      - ./all.py:/app/all.py
      - ./database.py:/app/database.py
      - ./all_charts.html:/app/all_charts.html
    command: sleep infinity

volumes:
  mysql_data:
